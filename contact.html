<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Your Name for questions, collaborations, and project discussions.">

    <meta name="author"
          content="Your Name">

    <meta name="robots"
          content="index, follow">

    <title>Contact</title>
</head>

<body>

    <a href="#main-content">Skip to main content</a>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">

        <section aria-labelledby="contact-heading">

            <h2 id="contact-heading">Get in Touch</h2>

            <p>
                Use the form below to send a message.
                All required fields are marked clearly.
            </p>

            <form action="#" method="post" aria-labelledby="contact-heading">

                <fieldset>

                    <legend>Contact Information</legend>

                    <div>
                        <label for="name">
                            Full Name <span aria-hidden="true">*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true">
                    </div>

                    <div>
                        <label for="email">
                            Email Address <span aria-hidden="true">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true">
                    </div>

                    <div>
                        <label for="subject">
                            Subject <span aria-hidden="true">*</span>
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-required="true">
                    </div>

                    <div>
                        <label for="message">
                            Message <span aria-hidden="true">*</span>
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                            aria-required="true"></textarea>
                    </div>

                    <button type="submit">
                        Send Message
                    </button>

                </fieldset>

            </form>

        </section>

        <aside aria-labelledby="contact-info-heading">

            <h2 id="contact-info-heading">Other Ways to Connect</h2>

            <address>
                <p>
                    Email:
                    <a href="mailto:example@email.com">
                        example@email.com
                    </a>
                </p>
            </address>

        </aside>

    </main>

    <footer>
        <p>&copy; 2026 Your Name. All rights reserved.</p>
    </footer>
</body>
</html>
